<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của Hưng 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f5e9; /* Màu xanh ngọc nhạt */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #2e7d32; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; color: #555; }
        .emoji { font-size: 50px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🚀✨</div>
        <h1>Tuyệt vời! Đây là Web 2</h1>
        <p>Đây là website thứ hai của Hưng.<br>Tên miền: <strong>hung2.dinhhungtnut.id.vn</strong></p>
        <p>Giao diện đơn giản, dễ nhìn và load cực nhanh.</p>
    </div>
</body>
</html>
