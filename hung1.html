<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của Hưng 1</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff; /* Màu xanh lơ nhạt */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #007bff; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; color: #555; }
        .emoji { font-size: 50px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">👋🏼👨🏻‍💻</div>
        <h1>Chào mừng đến với Web 1!</h1>
        <p>Đây là website đầu tiên của Hưng.<br>Tên miền: <strong>hung1.dinhhungtnut.id.vn</strong></p>
        <p>Hệ thống đang chạy trơn tru trên Docker & Nginx.</p>
    </div>
</body>
</html>
